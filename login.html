<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicoTalent - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/variables.css">
  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/components.css">
</head>
<body id="loginPage">

  <div class="login">
    <div class="login__container">
      
      <div class="login__logo">
        <span class="login__logo-img">💼</span>
        <h1 class="login__title">TicoTalent</h1>
        <p class="login__subtitle">Panel de Administración</p>
      </div>

      <form class="login__form" id="loginForm">
        
        <div class="login__field">
          <label class="login__label" for="loginEmail">Usuario</label>
          <input 
            class="login__input" 
            type="text" 
            id="loginEmail" 
            name="username"
            placeholder="Tu usuario"
            autocomplete="username"
            required
          >
        </div>

        <div class="login__field">
          <label class="login__label" for="loginPassword">Contraseña</label>
          <input 
            class="login__input" 
            type="password" 
            id="loginPassword" 
            name="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="login__error d-none" id="loginError"></div>

        <button class="login__btn" type="submit" id="btnLogin">
          <span class="btn__text">Iniciar Sesión</span>
          <span class="login__spinner d-none"></span>
        </button>

      </form>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="src/js/login.js"></script>
</body>
</html>
