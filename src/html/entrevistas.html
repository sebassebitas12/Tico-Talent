<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tico Talent - Entrevistas</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="main-page">
  <header class="main__header" id="mainHeader">
    <a class="main__brand" href="principal.html">Tico Talent</a>
    <nav class="main__navigation" id="mainNavigation" aria-label="Navegación principal">
      <ul class="main__navigation-list">
        <li class="main__navigation-item"><a class="main__navigation-link" href="principal.html">Inicio</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="candidatos.html">Candidatos</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="vacantes.html">Vacantes</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="empresas.html">Empresas</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="postulaciones.html">Postulaciones</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link main__navigation-link--active" href="entrevistas.html" aria-current="page">Entrevistas</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="tareas.html">Tareas</a></li>
      </ul>
    </nav>
    <div class="main__user" id="currentUser" aria-label="Usuario actual">
      <div class="main__user-info">
        <span class="main__user-name" id="userName"></span>
        <span class="main__user-role" id="userRole"></span>
      </div>
      <button class="btn btn--sm btn--secondary" id="btnLogout" style="margin-left: 1rem;">🚪 Salir</button>
    </div>
  </header>

  <main class="main" id="main">
    <section class="main__content" id="mainContent" aria-labelledby="viewTitle">
      <header class="main__content-header">
        <h1 class="main__title" id="viewTitle">Entrevistas</h1>
        <p class="main__description">Seguimiento de las entrevistas programadas.</p>
      </header>
      <div class="main__content-body" id="contentArea">
        <section class="interviews" aria-labelledby="interviewsListTitle">
          <h2 id="interviewsListTitle" class="sr-only">Listado de entrevistas</h2>
          <div id="interviewsList"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="main__footer" id="mainFooter"><p class="main__footer-text">Tico Talent</p></footer>

  <div class="toast-container toast-container--top-right" id="toastContainer"></div>
  <div class="loading loading--full d-none" id="loadingSpinner">
    <div class="loading__spinner loading__spinner--lg"></div>
    <p class="loading__text">Cargando...</p>
  </div>
  <div class="modal-overlay d-none" id="modalOverlay">
    <div class="modal" id="modalContainer">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Título</h2>
        <button class="modal__close" id="modalClose">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__footer">
        <button class="btn btn--secondary" id="btnFormCancel">Cancelar</button>
        <button class="btn btn--primary" id="btnFormSubmit">Guardar</button>
      </div>
    </div>
  </div>
  <div class="confirm-overlay d-none" id="confirmOverlay">
    <div class="confirm" id="confirmContainer">
      <div class="confirm__icon confirm__icon--danger">⚠️</div>
      <h3 class="confirm__title" id="confirmTitle">¿Estás seguro?</h3>
      <p class="confirm__message" id="confirmMessage">Esta acción no se puede deshacer.</p>
      <div class="confirm__actions">
        <button class="btn btn--secondary" id="btnConfirmNo">Cancelar</button>
        <button class="btn btn--danger" id="btnConfirmYes">Eliminar</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/entrevistas.js"></script>
</body>
</html>
