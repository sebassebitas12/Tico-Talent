<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tico Talent - Inicio</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="main-page">
  <header class="main__header" id="mainHeader">
    <a class="main__brand" href="principal.html">Tico Talent</a>
    <nav class="main__navigation" id="mainNavigation" aria-label="Navegación principal">
      <ul class="main__navigation-list">
        <li class="main__navigation-item"><a class="main__navigation-link main__navigation-link--active" href="principal.html" aria-current="page">Inicio</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="candidatos.html">Candidatos</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="vacantes.html">Vacantes</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="empresas.html">Empresas</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="postulaciones.html">Postulaciones</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="entrevistas.html">Entrevistas</a></li>
        <li class="main__navigation-item"><a class="main__navigation-link" href="tareas.html">Tareas</a></li>
      </ul>
    </nav>
    <div class="main__user" id="currentUser" aria-label="Usuario actual">
      <div class="main__user-info">
        <span class="main__user-name" id="userName">Usuario</span>
        <span class="main__user-role" id="userRole">Reclutador</span>
      </div>
      <button class="btn btn--sm btn--secondary" id="btnLogout" style="margin-left: 1rem;">🚪 Salir</button>
    </div>
  </header>
  <main class="main" id="main">
    <section class="main__content" id="mainContent" aria-labelledby="viewTitle">
      <header class="main__content-header"><h1 class="main__title" id="viewTitle">Inicio</h1><p class="main__description">Resumen general de Tico Talent.</p></header>
      <div class="main__content-body" id="contentArea">
        <section class="summary" aria-labelledby="summaryTitle">
          <h2 id="summaryTitle">Resumen</h2>
          <dl class="summary-list">
            <div class="summary-item"><dt>Candidatos</dt><dd id="candidatesTotal">...</dd></div>
            <div class="summary-item"><dt>Vacantes</dt><dd id="vacanciesTotal">...</dd></div>
            <div class="summary-item"><dt>Empresas</dt><dd id="companiesTotal">...</dd></div>
            <div class="summary-item"><dt>Postulaciones</dt><dd id="applicationsTotal">...</dd></div>
            <div class="summary-item"><dt>Tareas Registradas</dt><dd id="tasksTotal">...</dd></div>
          </dl>
        </section>
      </div>
    </section>
  </main>
  <footer class="main__footer" id="mainFooter"><p class="main__footer-text">Tico Talent</p></footer>

  <!-- Toasts y Loading -->
  <div class="toast-container toast-container--top-right" id="toastContainer"></div>
  <div class="loading loading--full d-none" id="loadingSpinner">
    <div class="loading__spinner loading__spinner--lg"></div>
    <p class="loading__text">Cargando métricas...</p>
  </div>

  <script type="module" src="../js/principal.js"></script>
</body>
</html>
