<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tico Talent - Mis Postulaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="main-page">

  <header id="appNavbar"></header>

  <div class="main-page__wrapper">
    <main class="main" id="main">
      <section class="main__content" id="mainContent" aria-labelledby="viewTitle">
        <header class="main__content-header">
          <h1 class="main__title" id="viewTitle">Mis Postulaciones</h1>
          <p class="main__description">Historial y estado de tus aplicaciones a ofertas de empleo.</p>
        </header>

        <div class="main__content-body" id="contentArea">
          <section class="applications" aria-labelledby="applicationsListTitle">
            <h2 id="applicationsListTitle" class="sr-only">Listado de postulaciones</h2>
            <div class="job-list" id="applicationsList"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="main__footer" id="mainFooter">
      <p class="main__footer-text">&copy; 2026 Tico Talent. Plataforma profesional de reclutamiento y talento en Costa Rica.</p>
    </footer>
  </div>

  <div class="toast-container toast-container--top-right" id="toastContainer"></div>
  <div class="loading loading--full d-none" id="loadingSpinner">
    <div class="loading__spinner loading__spinner--lg"></div>
    <p class="loading__text">Cargando...</p>
  </div>
  <div class="modal-overlay d-none" id="modalOverlay">
    <div class="modal" id="modalContainer">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Titulo</h2>
        <button class="modal__close" id="modalClose">X</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__footer">
        <button class="btn btn--secondary" id="btnFormCancel">Cancelar</button>
        <button class="btn btn--primary" id="btnFormSubmit">Guardar</button>
      </div>
    </div>
  </div>
  <div class="confirm-overlay d-none" id="confirmOverlay">
    <div class="confirm" id="confirmContainer">
      <div class="confirm__icon confirm__icon--danger">!</div>
      <h3 class="confirm__title" id="confirmTitle">Estas seguro?</h3>
      <p class="confirm__message" id="confirmMessage">Esta accion no se puede deshacer.</p>
      <div class="confirm__actions">
        <button class="btn btn--secondary" id="btnConfirmNo">Cancelar</button>
        <button class="btn btn--danger" id="btnConfirmYes">Eliminar</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/postulaciones.js"></script>
</body>
</html>
