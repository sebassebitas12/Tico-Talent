<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect - Iniciar Sesión</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body id="loginPage">

  <div class="login">
    <div class="login__container">
      
      <div class="login__logo">
        <span class="login__logo-img">💼</span>
        <h1 class="login__title">JobConnect</h1>
        <p class="login__subtitle">Panel de Administración</p>
      </div>

      <form class="login__form" id="loginForm">
        
        <div class="login__field">
          <label class="login__label" for="loginEmail">Usuario</label>
          <input 
            class="login__input" 
            type="text" 
            id="loginEmail" 
            name="username"
            placeholder="ej: emilys"
            autocomplete="username"
            required
          >
        </div>

        <div class="login__field">
          <label class="login__label" for="loginPassword">Contraseña</label>
          <input 
            class="login__input" 
            type="password" 
            id="loginPassword" 
            name="password"
            placeholder="ej: emilyspass"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="login__error d-none" id="loginError"></div>

        <button class="login__btn" type="submit" id="btnLogin">
          <span class="btn__text">Iniciar Sesión</span>
          <span class="login__spinner d-none"></span>
        </button>

      </form>

      <div class="login__footer">
        <p class="login__text">Demo: <strong>emilys</strong> / <strong>emilyspass</strong></p>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  </body>
</html>
