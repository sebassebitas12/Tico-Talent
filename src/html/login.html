<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tico Talent - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body id="loginPage">

  <div class="login">
    <div class="login__container">
      
      <div class="login__logo">
        <span class="login__logo-img">💼</span>
        <h1 class="login__title">Tico Talent</h1>
        <p class="login__subtitle">Plataforma de Reclutamiento Profesional</p>
      </div>

      <form class="login__form" id="loginForm" action="principal.html">
        
        <div class="login__field">
          <label class="login__label" for="loginEmail">Usuario / Correo Electrónico</label>
          <input 
            class="login__input" 
            type="text" 
            id="loginEmail" 
            name="username"
            placeholder="ej: emilys"
            autocomplete="username"
            value="emilys"
            required
          >
        </div>

        <div class="login__field">
          <label class="login__label" for="loginPassword">Contraseña</label>
          <input 
            class="login__input" 
            type="password" 
            id="loginPassword" 
            name="password"
            placeholder="ej: emilyspass"
            autocomplete="current-password"
            value="emilyspass"
            required
          >
        </div>

        <div class="login__error d-none" id="loginError"></div>

        <button class="login__btn" type="submit" id="btnLogin">
          <span class="btn__text">Iniciar Sesión</span>
          <span class="login__spinner d-none"></span>
        </button>

      </form>

      <div class="login__footer">
        <p class="login__text">Demo: <strong>emilys</strong> / <strong>emilyspass</strong></p>
        <p style="margin-top: 0.5rem;"><a href="principal.html" style="color: var(--primary-purple); font-weight: 600; text-decoration: none;">← Entrar como invitado</a></p>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
